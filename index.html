<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Job Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f9fafb;
      --surface-hover: #f3f4f6;
      --border: #e5e7eb;
      --border-focus: #1A33FF;
      --text: #111827;
      --text-muted: #6b7280;
      --accent: #1A33FF;
      --accent-hover: #1428cc;
      --accent-soft: #eef1ff;
      --accent-border: #c7d0ff;
      --radius: 10px;
    }

    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #181b23;
      --surface-hover: #212530;
      --border: #2a2f3d;
      --border-focus: #4d63ff;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #4d63ff;
      --accent-hover: #6477ff;
      --accent-soft: rgba(77, 99, 255, 0.16);
      --accent-border: rgba(77, 99, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 32px 16px 64px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .presets-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .presets-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .preset-chip {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
      body {
        padding: 20px 14px 48px;
      }
      .card {
        padding: 18px;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .hint {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 12px;
    }

    input[type="text"],
    select {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      width: 100%;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(26, 51, 255, 0.14);
    }

    .sites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .toggle-all {
      background: none;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      padding: 2px 4px;
    }

    .toggle-all:hover {
      text-decoration: underline;
    }

    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
    }

    .site-option {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      user-select: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-option:hover {
      border-color: var(--accent-border);
      background: var(--surface);
    }

    .site-option input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .site-option.checked {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .engines {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .engine-pill {
      flex: 1;
      min-width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .engine-pill input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .engine-pill.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .preview-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .preview-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .preview-actions {
      display: flex;
      gap: 8px;
    }

    .copy-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .query-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      color: var(--text);
      word-break: break-word;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1.5px solid var(--accent);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--accent);
    }

    .btn-secondary:hover {
      background: var(--accent-soft);
    }

    .saved-section {
      margin-top: 22px;
      display: none;
    }

    .saved-section.visible {
      display: block;
    }

    .saved-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
    }

    .saved-info {
      cursor: pointer;
      flex: 1;
    }

    .saved-info strong {
      color: var(--text);
    }

    .saved-info span {
      color: var(--text-muted);
      font-size: 12px;
      margin-left: 8px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span class="badge" data-i18n="badge">Moteur de recherche booléenne</span>
        <h1>My Job Radar</h1>
        <p class="subtitle" data-i18n="subtitle">Cherchez directement sur les sites carrières des entreprises et trouvez l'équipe qui recrute.</p>
      </div>
      <div class="header-controls">
        <button type="button" class="icon-btn" id="langBtn">EN</button>
        <button type="button" class="icon-btn" id="themeBtn">Mode sombre</button>
      </div>
    </header>

    <div class="presets-bar">
      <span class="presets-label" data-i18n="presetsLabel">Idées rapides :</span>
      <button type="button" class="preset-chip" data-titles="Product Marketing Manager, PMM, Responsable Marketing Produit" data-loc="Paris, Remote">Product Marketing</button>
      <button type="button" class="preset-chip" data-titles="Product Manager, Chef de Produit, Product Owner" data-loc="Paris, Remote">Product</button>
      <button type="button" class="preset-chip" data-titles="Account Executive, Business Developer, Sales" data-loc="Paris, Remote">Sales / BD</button>
      <button type="button" class="preset-chip" data-titles="Operations Manager, Chief of Staff, Chargé des opérations" data-loc="Paris, Remote">Operations</button>
      <button type="button" class="preset-chip" data-titles="FP&A, Financial Analyst, Contrôleur de gestion" data-loc="Paris, Remote">Finance</button>
    </div>

    <main class="card">
      <div class="grid-2">
        <div class="field">
          <label for="titles"><span data-i18n="titlesLabel">Intitulés de poste</span> <span class="hint" data-i18n="commaHint">(séparés par une virgule)</span></label>
          <input type="text" id="titles" value="Product Marketing Manager, PMM, Responsable Marketing Produit" />
        </div>

        <div class="field">
          <label for="location" data-i18n="locationLabel">Localisation</label>
          <input type="text" id="location" value="Paris, Remote" />
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="posted" data-i18n="postedLabel">Date de publication</label>
          <select id="posted">
            <option value="any" data-i18n="optAny">N'importe quand</option>
            <option value="day" data-i18n="optDay">Dernières 24h</option>
            <option value="week" selected data-i18n="optWeek">Cette semaine</option>
            <option value="month" data-i18n="optMonth">Ce mois-ci</option>
          </select>
        </div>

        <div class="field">
          <label for="include"><span data-i18n="includeLabel">Mots à inclure</span> <span class="hint" data-i18n="optHint">(optionnel)</span></label>
          <input type="text" id="include" placeholder="ex. AI, B2B, SaaS" />
        </div>

        <div class="field">
          <label for="exclude"><span data-i18n="excludeLabel">Mots à exclure</span> <span class="hint" data-i18n="optHint">(optionnel)</span></label>
          <input type="text" id="exclude" placeholder="ex. Stage, Alternance, Junior" />
        </div>
      </div>

      <div class="field">
        <div class="sites-header">
          <label data-i18n="sitesLabel">Plateformes carrières (ATS)</label>
          <button type="button" class="toggle-all" id="toggleAllBtn">Tout désélectionner</button>
        </div>
        <div class="sites-grid" id="sitesGrid"></div>
      </div>

      <div class="field">
        <label data-i18n="engineLabel">Moteur de recherche</label>
        <div class="engines" id="enginesGroup">
          <label class="engine-pill active">
            <input type="radio" name="engine" value="google" checked />
            Google
          </label>
          <label class="engine-pill">
            <input type="radio" name="engine" value="bing" />
            Bing
          </label>
          <label class="engine-pill">
            <input type="radio" name="engine" value="duckduckgo" />
            DuckDuckGo
          </label>
        </div>
      </div>

      <div class="preview-box">
        <div class="preview-top">
          <span class="preview-label" data-i18n="previewLabel">Aperçu en direct de la requête</span>
          <div class="preview-actions">
            <button type="button" class="copy-btn" id="saveSearchBtn" data-i18n="saveBtn">Sauvegarder</button>
            <button type="button" class="copy-btn" id="copyBtn" data-i18n="copyBtn">Copier</button>
          </div>
        </div>
        <div class="query-text" id="queryPreview"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="findJobsBtn" data-i18n="findJobsBtn">
          Trouver des offres &rarr;
        </button>
        <button type="button" class="btn btn-secondary" id="findTeamBtn" data-i18n="findTeamBtn">
          Trouver l'équipe LinkedIn &rarr;
        </button>
      </div>
    </main>

    <section class="saved-section" id="savedSection">
      <div class="saved-title" data-i18n="savedTitle">Recherches sauvegardées</div>
      <div class="saved-list" id="savedList"></div>
    </section>

    <footer data-i18n="footerText">
      My Job Radar &middot; Les recherches s'ouvrent directement dans un nouvel onglet
    </footer>
  </div>

  <script>
    const I18N = {
      fr: {
        badge: "Moteur de recherche booléenne",
        subtitle: "Cherchez directement sur les sites carrières des entreprises et trouvez l'équipe qui recrute.",
        presetsLabel: "Idées rapides :",
        titlesLabel: "Intitulés de poste",
        commaHint: "(séparés par une virgule)",
        locationLabel: "Localisation",
        postedLabel: "Date de publication",
        optAny: "N'importe quand",
        optDay: "Dernières 24h",
        optWeek: "Cette semaine",
        optMonth: "Ce mois-ci",
        includeLabel: "Mots à inclure",
        excludeLabel: "Mots à exclure",
        optHint: "(optionnel)",
        sitesLabel: "Plateformes carrières (ATS)",
        selectAll: "Tout sélectionner",
        deselectAll: "Tout désélectionner",
        engineLabel: "Moteur de recherche",
        previewLabel: "Aperçu en direct de la requête",
        saveBtn: "Sauvegarder",
        savedDone: "Sauvegardé !",
        copyBtn: "Copier",
        copiedDone: "Copié !",
        findJobsBtn: "Trouver des offres →",
        findTeamBtn: "Trouver l'équipe LinkedIn →",
        savedTitle: "Recherches sauvegardées",
        footerText: "My Job Radar · Les recherches s'ouvrent directement dans un nouvel onglet",
        darkMode: "Mode sombre",
        lightMode: "Mode clair",
        emptyPreview: "Saisissez un intitulé de poste ou cochez une plateforme..."
      },
      en: {
        badge: "Boolean Search Builder",
        subtitle: "Search directly across company career boards and find the hiring team.",
        presetsLabel: "Quick presets:",
        titlesLabel: "Job titles",
        commaHint: "(comma separated)",
        locationLabel: "Location",
        postedLabel: "Posted",
        optAny: "Any time",
        optDay: "Past 24 hours",
        optWeek: "Past week",
        optMonth: "Past month",
        includeLabel: "Include words",
        excludeLabel: "Exclude words",
        optHint: "(optional)",
        sitesLabel: "Career sites (ATS)",
        selectAll: "Select all",
        deselectAll: "Deselect all",
        engineLabel: "Search engine",
        previewLabel: "Live search query preview",
        saveBtn: "Save search",
        savedDone: "Saved!",
        copyBtn: "Copy query",
        copiedDone: "Copied!",
        findJobsBtn: "Find jobs →",
        findTeamBtn: "Search LinkedIn hiring team →",
        savedTitle: "Saved searches",
        footerText: "My Job Radar · Searches open directly in a new tab",
        darkMode: "Dark mode",
        lightMode: "Light mode",
        emptyPreview: "Enter a job title or select a career site..."
      }
    };

    const CAREER_SITES = [
      { name: 'Greenhouse', site: 'site:greenhouse.io', checked: true },
      { name: 'Lever', site: 'site:jobs.lever.co', checked: true },
      { name: 'Ashby', site: 'site:jobs.ashbyhq.com', checked: true },
      { name: 'Workable', site: 'site:apply.workable.com', checked: true },
      { name: 'Teamtailor', site: 'site:teamtailor.com', checked: true },
      { name: 'SmartRecruiters', site: 'site:jobs.smartrecruiters.com', checked: true },
      { name: 'Workday', site: 'site:myworkdayjobs.com', checked: true },
      { name: 'Welcome to the Jungle', site: 'site:welcometothejungle.com', checked: true }
    ];

    let currentLang = 'fr';
    let isDark = false;

    const sitesGrid = document.getElementById('sitesGrid');
    const toggleAllBtn = document.getElementById('toggleAllBtn');
    const titlesInput = document.getElementById('titles');
    const locationInput = document.getElementById('location');
    const postedSelect = document.getElementById('posted');
    const includeInput = document.getElementById('include');
    const excludeInput = document.getElementById('exclude');
    const queryPreview = document.getElementById('queryPreview');
    const copyBtn = document.getElementById('copyBtn');
    const saveSearchBtn = document.getElementById('saveSearchBtn');
    const findJobsBtn = document.getElementById('findJobsBtn');
    const findTeamBtn = document.getElementById('findTeamBtn');
    const langBtn = document.getElementById('langBtn');
    const themeBtn = document.getElementById('themeBtn');
    const savedSection = document.getElementById('savedSection');
    const savedList = document.getElementById('savedList');

    function applyTranslations() {
      const dict = I18N[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
      langBtn.textContent = currentLang === 'fr' ? 'EN' : 'FR';
      themeBtn.textContent = isDark ? dict.lightMode : dict.darkMode;
      updateToggleAllText();
      updatePreview();
    }

    langBtn.addEventListener('click', () => {
      currentLang = currentLang === 'fr' ? 'en' : 'fr';
      applyTranslations();
    });

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? I18N[currentLang].lightMode : I18N[currentLang].darkMode;
    });

    document.querySelectorAll('.preset-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        titlesInput.value = chip.dataset.titles;
        locationInput.value = chip.dataset.loc;
        updatePreview();
      });
    });

    function renderSites() {
      sitesGrid.innerHTML = '';
      CAREER_SITES.forEach((item, idx) => {
        const label = document.createElement('label');
        label.className = 'site-option' + (item.checked ? ' checked' : '');
        label.title = item.name;
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.checked;
        checkbox.addEventListener('change', (e) => {
          CAREER_SITES[idx].checked = e.target.checked;
          label.classList.toggle('checked', e.target.checked);
          updateToggleAllText();
          updatePreview();
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(item.name));
        sitesGrid.appendChild(label);
      });
      updateToggleAllText();
    }

    function updateToggleAllText() {
      const allChecked = CAREER_SITES.every(s => s.checked);
      toggleAllBtn.textContent = allChecked ? I18N[currentLang].deselectAll : I18N[currentLang].selectAll;
    }

    toggleAllBtn.addEventListener('click', () => {
      const targetState = !CAREER_SITES.every(s => s.checked);
      CAREER_SITES.forEach(s => s.checked = targetState);
      renderSites();
      updatePreview();
    });

    function parseCommaTerms(raw) {
      return raw.split(',').map(s => s.trim()).filter(Boolean);
    }

    function formatOrGroup(terms) {
      if (terms.length === 0) return '';
      if (terms.length === 1) return `"${terms[0]}"`;
      return '(' + terms.map(t => `"${t}"`).join(' OR ') + ')';
    }

    function buildJobQuery() {
      const parts = [];
      const activeSites = CAREER_SITES.filter(s => s.checked).map(s => s.site);
      if (activeSites.length === 1) {
        parts.push(activeSites[0]);
      } else if (activeSites.length > 1) {
        parts.push('(' + activeSites.join(' OR ') + ')');
      }

      const titles = parseCommaTerms(titlesInput.value);
      if (titles.length) parts.push(formatOrGroup(titles));

      const locations = parseCommaTerms(locationInput.value);
      if (locations.length) parts.push(formatOrGroup(locations));

      parseCommaTerms(includeInput.value).forEach(w => parts.push(`"${w}"`));
      parseCommaTerms(excludeInput.value).forEach(w => parts.push(`-"${w}"`));

      return parts.join(' ');
    }

    function buildHiringTeamQuery() {
      const parts = [
        'site:linkedin.com/in',
        '("hiring manager" OR "talent acquisition" OR "recruiter" OR "head of" OR "VP" OR "DRH")'
      ];
      const titles = parseCommaTerms(titlesInput.value);
      if (titles.length) parts.push(formatOrGroup(titles));

      const locations = parseCommaTerms(locationInput.value);
      if (locations.length) parts.push(formatOrGroup(locations));

      parseCommaTerms(includeInput.value).forEach(w => parts.push(`"${w}"`));
      return parts.join(' ');
    }

    function getSelectedEngine() {
      const checked = document.querySelector('input[name="engine"]:checked');
      return checked ? checked.value : 'google';
    }

    function buildSearchUrl(query, applyDateFilter = true) {
      const engine = getSelectedEngine();
      const posted = postedSelect.value;
      const encoded = encodeURIComponent(query);

      if (engine === 'bing') {
        let url = `https://www.bing.com/search?q=${encoded}`;
        if (applyDateFilter && posted !== 'any') {
          const bingMap = { day: 'ez1', week: 'ez2', month: 'ez3' };
          url += `&filters=ex1%3a%22${bingMap[posted]}%22`;
        }
        return url;
      }

      if (engine === 'duckduckgo') {
        let url = `https://duckduckgo.com/?q=${encoded}`;
        if (applyDateFilter && posted !== 'any') {
          const ddgMap = { day: 'd', week: 'w', month: 'm' };
          url += `&df=${ddgMap[posted]}`;
        }
        return url;
      }

      let url = `https://www.google.com/search?q=${encoded}`;
      if (applyDateFilter && posted !== 'any') {
        const googleMap = { day: 'd', week: 'w', month: 'm' };
        url += `&tbs=qdr:${googleMap[posted]}`;
      }
      return url;
    }

    function updatePreview() {
      const query = buildJobQuery();
      queryPreview.textContent = query || I18N[currentLang].emptyPreview;
    }

    [titlesInput, locationInput, includeInput, excludeInput].forEach(el => {
      el.addEventListener('input', updatePreview);
    });
    postedSelect.addEventListener('change', updatePreview);

    document.querySelectorAll('input[name="engine"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.engine-pill').forEach(pill => {
          pill.classList.toggle('active', pill.querySelector('input').checked);
        });
      });
    });

    copyBtn.addEventListener('click', async () => {
      const text = buildJobQuery();
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = I18N[currentLang].copiedDone;
        setTimeout(() => { copyBtn.textContent = I18N[currentLang].copyBtn; }, 1500);
      } catch (e) {}
    });

    // Saved searches (localStorage)
    function loadSavedSearches() {
      try {
        return JSON.parse(localStorage.getItem('myJobRadarSaved') || '[]');
      } catch (e) {
        return [];
      }
    }

    function renderSavedSearches() {
      const items = loadSavedSearches();
      if (!items.length) {
        savedSection.classList.remove('visible');
        return;
      }
      savedSection.classList.add('visible');
      savedList.innerHTML = '';
      items.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'saved-item';
        const info = document.createElement('div');
        info.className = 'saved-info';
        info.innerHTML = `<strong>${item.titles || 'Sans titre'}</strong><span>${item.location || ''}</span>`;
        info.addEventListener('click', () => {
          titlesInput.value = item.titles;
          locationInput.value = item.location;
          includeInput.value = item.include;
          excludeInput.value = item.exclude;
          postedSelect.value = item.posted;
          updatePreview();
        });

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          const updated = loadSavedSearches().filter((_, i) => i !== idx);
          localStorage.setItem('myJobRadarSaved', JSON.stringify(updated));
          renderSavedSearches();
        });

        row.appendChild(info);
        row.appendChild(del);
        savedList.appendChild(row);
      });
    }

    saveSearchBtn.addEventListener('click', () => {
      const items = loadSavedSearches();
      items.unshift({
        titles: titlesInput.value,
        location: locationInput.value,
        include: includeInput.value,
        exclude: excludeInput.value,
        posted: postedSelect.value
      });
      localStorage.setItem('myJobRadarSaved', JSON.stringify(items.slice(0, 8)));
      renderSavedSearches();
      saveSearchBtn.textContent = I18N[currentLang].savedDone;
      setTimeout(() => { saveSearchBtn.textContent = I18N[currentLang].saveBtn; }, 1500);
    });

    findJobsBtn.addEventListener('click', () => {
      const query = buildJobQuery();
      if (!query) return;
      window.open(buildSearchUrl(query, true), '_blank', 'noopener,noreferrer');
    });

    findTeamBtn.addEventListener('click', () => {
      const query = buildHiringTeamQuery();
      window.open(buildSearchUrl(query, false), '_blank', 'noopener,noreferrer');
    });

    renderSites();
    renderSavedSearches();
    applyTranslations();
  </script>
</body>
</html>
